# 1.21.1 keeps AbstractArrow#setPierceLevel private, which leaves bows unable to use
# the pierce mechanic that vanilla already implements. Opening it is all we need -
# no mixin, and the field is only touched from our own enchantment hook.
#
# AT rule format is: <access> <class> <method><descriptor-with-return-type>
public net.minecraft.world.entity.projectile.AbstractArrow setPierceLevel(B)V

# The jump key state lives on LivingEntity#jumping, which is protected. Reading it is
# how the winged boots know a charge is being held - the value is already synced to
# the server from the player's input packet, so no packet of our own is needed.
public net.minecraft.world.entity.LivingEntity jumping
